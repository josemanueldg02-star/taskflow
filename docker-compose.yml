services:
  postgres:
    image: postgres:18
    container_name: taskflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - taskflow_pgdata:/var/lib/postgresql

volumes:
  taskflow_pgdata: